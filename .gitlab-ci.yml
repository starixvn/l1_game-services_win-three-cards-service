variables:
    ENABLE_NODEJS_INTEGRATION_TEST: 'true'
    NODEJS_INTEGRATION_TEST_IMAGE_VERSION: hub.lumigame.com/base/node:18.1-buster-slim
    NODEJS_INTEGRATION_TEST_DB_IMAGE_VERSION: hub.lumigame.com/pentagon-base/mongo:4.4.8
  
include:
    - project: "ci/repos-ci/pentagon_l1_win_three_cards_service"
      ref: master
      file: "gitlab-ci.yml"

    - project: "ci/repos-ci/pentagon_l2_win_three_cards_service"
      ref: master
      file: "gitlab-ci-mixing.yml"

    - project: "ci/common-ci"
      ref: rocketor
      file: "integration-test/nodejs-integration-test.gitlab-ci.yml"  

unit-test-js:
  image: hub.lumigame.com/base/node:18.1-buster-slim
  artifacts:
    when: always
    reports:
      junit: coverage/*.xml
      cobertura: coverage/cobertura-coverage.xml
